<svg width="800" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="40%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166"/>
      <stop offset="50%" style="stop-color:#d2a8ff"/>
      <stop offset="100%" style="stop-color:#79c0ff"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#f78166;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#d2a8ff;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#79c0ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#79c0ff;stop-opacity:0"/>
    </linearGradient>

    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d2a8ff;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#d2a8ff;stop-opacity:0.02"/>
    </linearGradient>
    <linearGradient id="wave2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#79c0ff;stop-opacity:0.14"/>
      <stop offset="100%" style="stop-color:#79c0ff;stop-opacity:0.01"/>
    </linearGradient>
    <linearGradient id="wave3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:0.09"/>
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:0.01"/>
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2332"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>

    <radialGradient id="screenReflect" cx="50%" cy="0%" r="80%">
      <stop offset="0%" style="stop-color:#79c0ff;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#79c0ff;stop-opacity:0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="monitorGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="bannerClip">
      <rect width="800" height="220" rx="12"/>
    </clipPath>
  </defs>

